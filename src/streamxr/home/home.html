<!doctype html>
<!-- StreamXR Home (docs/Home-Page.md): a page of StreamXR's own, opened from the toolbar popup
     and once on install (with ?welcome=1: the first-run welcome). The headset's status and
     Quick troubleshooting, and the sites. Built by home.js from home-ui.js's pieces (shared
     with the toolbar popup); styled by the site popup's panel styles (popup.css), home-ui.css
     and home.css. Scripts in load order, plain (no modules); extension pages can't run inline
     scripts. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamXR Home</title>
<link rel="icon" href="../../../icons/icon-32.png">
<link rel="stylesheet" href="../ui/popup.css">
<link rel="stylesheet" href="home-ui.css">
<link rel="stylesheet" href="home.css">
</head>
<body>
<main class="streamxr-pop streamxr-home"></main>
<script src="../../core/ui/shared/i18n.js"></script>
<script src="../../core/ui/shared/strings-en.js"></script>
<script src="../../core/ui/shared/strings-es.js"></script>
<script src="../ui/shared/strings-en.js"></script>
<script src="../ui/shared/strings-es.js"></script>
<script src="../ui/goggles-icon.js"></script>
<script src="../ui/troubleshoot.js"></script>
<script src="../../core/page/diagnostics.js"></script>
<script src="sites.js"></script>
<script src="../../sites/youtube/home/site.js"></script>
<script src="home-ui.js"></script>
<script src="home.js"></script>
</body>
</html>
